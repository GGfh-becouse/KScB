<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909">
<title>Администрирование — КШБ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:#ddd}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid #292929;padding:17px 0}.bar{display:flex;justify-content:space-between;align-items:center}.brand{color:white;text-decoration:none;font-weight:650}.brand small{display:block;color:#888;font-size:11px;font-weight:400}.btn{background:#f3f3f3;color:#111;border:1px solid #eee;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer}.btn.secondary,.btn.reject,.btn.danger{background:transparent;color:#eee;border-color:#454545}.btn.danger{color:#e9aaaa}.btn:disabled{opacity:.45;cursor:wait}.hidden{display:none!important}main{padding:36px 0 60px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#999}h1{font-size:28px;font-weight:580;margin:5px 0 20px}.login{max-width:420px;margin:30px auto;padding:22px;border:1px solid #303030;background:#101010}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;color:#bbb;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#090909;color:white;border:1px solid #444;font:inherit}.field textarea{min-height:340px;resize:vertical}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #333;margin:16px 0 20px;padding-bottom:12px}.tab{border:1px solid #383838;background:transparent;color:#bbb;padding:8px 11px;cursor:pointer}.tab.active{background:#eee;color:#111;border-color:#eee}.panel{border:1px solid #303030;background:#101010;padding:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.msg{color:#bbb;font-size:12px}.error{color:#eda4a4}.list{border:1px solid #303030}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 15px;border-bottom:1px solid #292929}.row:last-child{border-bottom:0}.meta{font-size:12px;color:#999;margin-top:3px}.actions{display:flex;gap:7px;flex-shrink:0}.actions .btn{font-size:12px;padding:6px 9px}.empty{padding:20px;color:#999}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px}.formgrid .field{margin:5px 0 12px}.hint{color:#999;font-size:12px;margin:12px 0}.warn{padding:11px;border:1px solid #513f27;color:#d4c49c;margin:12px 0;font-size:12px}@media(max-width:720px){.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.row{display:block}.actions{margin-top:10px}.formgrid{grid-template-columns:1fr}.toolbar .msg{width:100%}}
</style>
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="../index.html">КШБ<small>Панель управления</small></a><div class="toolbar"><span id="who" class="eyebrow"></span><button id="logout" class="btn secondary hidden">Выйти</button></div></div></header>
<main class="wrap">
<section id="login" class="login"><div class="eyebrow">Защищённый вход</div><h1>Вход администратора</h1><form id="loginForm"><label class="field"><span>Электронная почта</span><input name="email" type="email" required autocomplete="username"></label><label class="field"><span>Пароль</span><input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Войти</button><div id="loginMsg" class="msg"></div></form></section>
<section id="dashboard" class="hidden"><div class="eyebrow">Управление организацией</div><h1>Панель администратора</h1><nav class="tabs"><button class="tab active" data-tab="applications">Заявки</button><button class="tab" data-tab="members">Участники</button><button class="tab" data-tab="positions">Должности</button><button class="tab" data-tab="constitution">Конституция</button><button class="tab" data-tab="audit">Журнал действий</button></nav>
<section id="view-applications" class="view"><div class="toolbar"><button class="btn secondary" data-refresh="applications">Обновить</button><span class="msg" id="appMsg"></span></div><div class="list" id="appList"></div></section>
<section id="view-members" class="view hidden"><div class="panel"><h2>Добавить участника</h2><form id="memberForm" class="formgrid"><label class="field"><span>Имя</span><input name="first_name" required maxlength="80"></label><label class="field"><span>Фамилия</span><input name="last_name" required maxlength="80"></label><label class="field"><span>Класс</span><input name="class_name" maxlength="20"></label><label class="field"><span>Сторона</span><select name="side_id" required></select></label><label class="field"><span>Должность</span><select name="position_id"></select></label><div class="field" style="align-self:end"><button class="btn">Добавить</button></div></form><div id="memberMsg" class="msg"></div></div><h2>Состав КШБ</h2><div class="toolbar"><button class="btn secondary" data-refresh="members">Обновить</button></div><div class="list" id="memberList"></div></section>
<section id="view-positions" class="view hidden"><div class="panel"><h2>Добавить должность</h2><form id="positionForm" class="formgrid"><label class="field"><span>Название</span><input name="name" required maxlength="100"></label><label class="field"><span>Сторона (пусто — общая)</span><select name="side_id"></select></label><label class="field"><span>Порядок</span><input name="sort_order" type="number" value="10"></label><div class="field" style="align-self:end"><button class="btn">Создать</button></div></form><div id="positionMsg" class="msg"></div></div><h2>Список должностей</h2><div class="list" id="positionList"></div></section>
<section id="view-constitution" class="view hidden"><div class="warn">Сохранение публикует новую версию Конституции. Предыдущая редакция сохраняется в базе.</div><label class="field"><span>Опубликованный текст Конституции</span><textarea id="constitutionText"></textarea></label><div class="toolbar"><button id="publishConstitution" class="btn">Опубликовать новую версию</button><button class="btn secondary" data-refresh="constitution">Загрузить текущую</button><span class="msg" id="constitutionMsg"></span></div><div id="constitutionVersions" class="list"></div></section>
<section id="view-audit" class="view hidden"><div class="toolbar"><button class="btn secondary" data-refresh="audit">Обновить журнал</button></div><div class="list" id="auditList"></div></section>
<div id="globalMsg" class="msg"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="./admin.js"></script>
</body></html>
